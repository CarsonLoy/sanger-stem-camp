<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title description">
  <title id="title">Simple electrical circuit</title>
  <desc id="description">A closed conductor loop connects a battery power source to an LED load.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46566c" />
    </marker>
  </defs>

  <rect width="900" height="540" fill="#fffdf8" />

  <!-- Conductor loop -->
  <path d="M 110 150 H 380 M 460 150 H 760 V 420 H 500 M 340 420 H 110 Z" fill="none" stroke="#68778a" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" />

  <!-- Battery / power source -->
  <line x1="395" y1="110" x2="395" y2="190" stroke="#087f78" stroke-width="9" />
  <line x1="445" y1="125" x2="445" y2="175" stroke="#16263d" stroke-width="9" />
  <text x="370" y="105" fill="#16263d" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">+</text>
  <text x="450" y="105" fill="#16263d" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">−</text>

  <!-- LED load -->
  <circle cx="420" cy="420" r="70" fill="#fff5d8" stroke="#16263d" stroke-width="7" />
  <path d="M 374 374 L 466 466 M 466 374 L 374 466" fill="none" stroke="#e3a326" stroke-linecap="round" stroke-width="8" />

  <!-- Power source callout -->
  <text x="520" y="54" fill="#16263d" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Power source</text>
  <path d="M 505 62 L 465 72 L 430 116" fill="none" marker-end="url(#arrow)" stroke="#46566c" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />

  <!-- Conductor callout -->
  <text x="690" y="258" fill="#16263d" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Conductor</text>
  <path d="M 675 264 L 630 270 L 765 300" fill="none" marker-end="url(#arrow)" stroke="#46566c" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />

  <!-- Load callout -->
  <text x="570" y="510" fill="#16263d" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Load (LED)</text>
  <path d="M 555 497 L 510 490 L 469 463" fill="none" marker-end="url(#arrow)" stroke="#46566c" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
</svg>
